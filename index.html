<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linfovia: Viaje por la Red Linfática</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7F7F9;font-family:'Segoe UI','Inter',system-ui,sans-serif;overflow:hidden;user-select:none}
#gameCanvas{display:block;width:100vw;height:100vh}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.overlay.active{pointer-events:all}
.overlay>*{pointer-events:all}

/* MAIN MENU */
#mainMenu{background:linear-gradient(135deg,#F7F7F9 0%,#EADFF7 50%,#BEE7E8 100%);flex-direction:column;gap:16px}
#mainMenu h1{font-size:clamp(36px,6vw,72px);color:#A3D9A5;text-shadow:0 2px 20px rgba(163,217,165,0.3);letter-spacing:4px}
#mainMenu h2{font-size:clamp(14px,2vw,22px);color:#7FD6B8;letter-spacing:2px;margin-top:-8px}
.menuBtn{min-width:280px;padding:14px 32px;font-size:18px;border:2px solid;border-radius:12px;cursor:pointer;transition:all .15s;font-weight:600;letter-spacing:0.5px;background:rgba(255,255,255,0.7);backdrop-filter:blur(4px)}
.menuBtn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.menuBtn.primary{border-color:#A3D9A5;color:#2d6a2f;background:rgba(163,217,165,0.2)}
.menuBtn.primary:hover{background:rgba(163,217,165,0.4)}
.menuBtn.secondary{border-color:#BEE7E8;color:#3a7a7c;background:rgba(190,231,232,0.2)}
.menuBtn.secondary:hover{background:rgba(190,231,232,0.4)}
.menuBtn.tertiary{border-color:#EDEDED;color:#666;background:rgba(237,237,237,0.3);font-size:15px;min-width:220px;padding:10px 24px}
.menuBtn.tertiary:hover{background:rgba(237,237,237,0.6)}
.menuSpacer{height:12px}
.menuFooter{font-size:12px;color:#999;margin-top:20px}

/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;padding:8px 16px;display:none;z-index:10}
#hud.active{display:flex;align-items:center;justify-content:space-between;background:rgba(247,247,249,0.85);backdrop-filter:blur(8px);border-bottom:1px solid #EDEDED}
#hud .hudLeft{display:flex;align-items:center;gap:16px}
#hud .hudTitle{font-size:16px;font-weight:700;color:#A3D9A5}
#hud .hudSubtitle{font-size:12px;color:#888}
#hud .hudProgress{width:200px;height:6px;background:#EDEDED;border-radius:3px;overflow:hidden}
#hud .hudProgressFill{height:100%;background:linear-gradient(90deg,#A3D9A5,#7FD6B8);border-radius:3px;transition:width .5s}
#hud .hudScore{font-size:14px;color:#7FD6B8;font-weight:600}
#hud .hudRight{display:flex;align-items:center;gap:8px}
.hudBtn{padding:6px 12px;border:1px solid #EDEDED;border-radius:8px;background:rgba(255,255,255,0.8);cursor:pointer;font-size:13px;color:#666;transition:all .15s}
.hudBtn:hover{background:#EDEDED;color:#333}

/* DIALOGUE */
#dialogueBox{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:min(600px,90%);background:rgba(255,245,230,0.95);backdrop-filter:blur(12px);border-radius:16px;border:2px solid #EADFF7;padding:24px;display:none;z-index:20;box-shadow:0 8px 32px rgba(0,0,0,0.1)}
#dialogueBox.active{display:block}
#dialogueBox .dlgTitle{font-size:20px;font-weight:700;color:#A3D9A5;margin-bottom:8px}
#dialogueBox .dlgText{font-size:15px;color:#444;line-height:1.6;margin-bottom:16px;white-space:pre-line}
#dialogueBox .dlgChoices{display:flex;flex-direction:column;gap:8px}
#dialogueBox .dlgChoice{padding:10px 16px;border:2px solid #BEE7E8;border-radius:10px;background:rgba(190,231,232,0.15);cursor:pointer;font-size:15px;color:#3a7a7c;transition:all .15s;text-align:center}
#dialogueBox .dlgChoice:hover{background:rgba(190,231,232,0.4);border-color:#7FD6B8}

/* INTERACTION PROMPT */
#interactPrompt{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;display:none;z-index:15;white-space:nowrap}
#interactPrompt.active{display:block}

/* TOOLTIP */
#tooltip{position:absolute;background:rgba(0,0,0,0.8);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;display:none;z-index:25;pointer-events:none;max-width:250px;line-height:1.4}
#tooltip.active{display:block}

/* QUIZ */
#quizScreen{background:linear-gradient(135deg,#F7F7F9,#EADFF7);flex-direction:column;gap:12px;padding:24px}
#quizScreen.active{display:flex}
#quizScreen .quizHeader{text-align:center;margin-bottom:8px}
#quizScreen .quizTitle{font-size:24px;font-weight:700;color:#A3D9A5}
#quizScreen .quizProgress{width:400px;max-width:80%;height:8px;background:#EDEDED;border-radius:4px;overflow:hidden;margin:8px auto}
#quizScreen .quizProgressFill{height:100%;background:#7FD6B8;border-radius:4px;transition:width .3s}
#quizScreen .quizQuestion{font-size:20px;font-weight:600;color:#333;text-align:center;max-width:600px;line-height:1.5;margin:16px 0}
#quizScreen .quizAnswers{display:flex;flex-direction:column;gap:10px;width:min(500px,90%)}
#quizScreen .quizAnswer{padding:14px 20px;border:2px solid #EDEDED;border-radius:12px;background:rgba(255,255,255,0.8);cursor:pointer;font-size:16px;transition:all .15s;text-align:left}
#quizScreen .quizAnswer:hover{border-color:#7FD6B8;background:rgba(127,214,184,0.15)}
#quizScreen .quizAnswer.correct{border-color:#A3D9A5;background:rgba(163,217,165,0.3);color:#2d6a2f}
#quizScreen .quizAnswer.incorrect{border-color:#E64A4A;background:rgba(230,74,74,0.15);color:#c0392b}
#quizScreen .quizAnswer.disabled{pointer-events:none;opacity:0.6}
#quizScreen .quizFeedback{font-size:14px;color:#555;text-align:center;max-width:500px;line-height:1.5;min-height:60px;padding:12px;background:rgba(255,255,255,0.5);border-radius:10px}
#quizScreen .quizNext{padding:12px 32px;border:2px solid #7FD6B8;border-radius:10px;background:rgba(127,214,184,0.2);cursor:pointer;font-size:16px;color:#2d8a6e;font-weight:600;display:none}
#quizScreen .quizNext:hover{background:rgba(127,214,184,0.4)}
#quizScreen .quizScore{font-size:16px;color:#7FD6B8;font-weight:600}
#quizScreen .quizResult{text-align:center;padding:20px}
#quizScreen .quizResult h3{font-size:28px;color:#A3D9A5;margin-bottom:8px}
#quizScreen .quizResult p{font-size:16px;color:#555;line-height:1.6}

/* SANDBOX PANEL */
#sandboxPanel{position:absolute;top:60px;right:10px;background:rgba(255,245,230,0.95);backdrop-filter:blur(8px);border-radius:12px;border:1px solid #EDEDED;padding:16px;display:none;z-index:20;width:220px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
#sandboxPanel.active{display:block}
#sandboxPanel h3{font-size:14px;color:#A3D9A5;margin-bottom:12px;font-weight:700}
.toolBtn{display:block;width:100%;padding:8px 12px;margin-bottom:6px;border:1px solid #EDEDED;border-radius:8px;background:rgba(255,255,255,0.8);cursor:pointer;font-size:13px;text-align:left;transition:all .15s}
.toolBtn:hover{background:rgba(163,217,165,0.2);border-color:#A3D9A5}
.toolBtn.active{background:rgba(163,217,165,0.3);border-color:#7FD6B8;font-weight:600}
.speedControl{margin-top:12px;display:flex;align-items:center;gap:8px}
.speedControl label{font-size:12px;color:#666}
.speedControl input[type=range]{flex:1}

/* MINIMAP */
#minimap{position:absolute;bottom:50px;right:10px;width:200px;height:100px;background:rgba(247,247,249,0.9);border:1px solid #EDEDED;border-radius:8px;display:none;z-index:15;overflow:hidden}
#minimap.active{display:block}
#minimapCanvas{width:100%;height:100%}

/* PAUSE */
#pauseScreen{background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);flex-direction:column;gap:12px}
#pauseScreen.active{display:flex}
#pauseScreen h2{font-size:32px;color:#fff;margin-bottom:16px}
#pauseScreen .menuBtn{background:rgba(255,255,255,0.2);color:#fff;border-color:rgba(255,255,255,0.4)}
#pauseScreen .menuBtn:hover{background:rgba(255,255,255,0.35)}

/* SETTINGS */
#settingsPanel{background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);flex-direction:column;gap:12px}
#settingsPanel.active{display:flex}
#settingsPanel .settingsContent{background:#F7F7F9;border-radius:16px;padding:24px;width:min(500px,90%);max-height:80vh;overflow-y:auto}
#settingsPanel h2{font-size:22px;color:#A3D9A5;margin-bottom:16px}
.settingRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDEDED}
.settingRow label{font-size:14px;color:#444}
.settingRow select,.settingRow input[type=range]{padding:4px 8px;border:1px solid #EDEDED;border-radius:6px;background:#fff;font-size:13px}

/* BADGE POPUP */
#badgePopup{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(163,217,165,0.95);color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;font-weight:600;z-index:30;transition:transform .5s ease;white-space:nowrap}
#badgePopup.active{transform:translateX(-50%) translateY(0)}

/* ZOOM INDICATOR */
#zoomIndicator{position:absolute;bottom:50px;left:10px;background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;display:none;z-index:15}
#zoomIndicator.active{display:block}

/* KNOWLEDGE CARD POPUP */
#cardPopup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-radius:16px;border:2px solid #EADFF7;padding:24px;width:min(450px,90%);z-index:25;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
#cardPopup.active{display:block}
#cardPopup .cardTitle{font-size:18px;font-weight:700;color:#A3D9A5;margin-bottom:8px}
#cardPopup .cardContent{font-size:14px;color:#444;line-height:1.7;margin-bottom:16px}
#cardPopup .cardClose{padding:8px 20px;border:2px solid #7FD6B8;border-radius:8px;background:rgba(127,214,184,0.2);cursor:pointer;font-size:14px;color:#2d8a6e;font-weight:600}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- MAIN MENU -->
<div id="mainMenu" class="overlay active">
  <h1>LINFOVIA</h1>
  <h2>Viaje por la Red Linfática</h2>
  <div class="menuSpacer"></div>
  <button class="menuBtn primary" onclick="startGame('learning')">🎓 Modo Aprendizaje</button>
  <button class="menuBtn secondary" onclick="startGame('exploration')">🔍 Modo Exploración</button>
  <button class="menuBtn secondary" onclick="startSandbox()">🧪 Laboratorio Virtual</button>
  <div class="menuSpacer"></div>
  <button class="menuBtn tertiary" onclick="showSettings()">⚙️ Configuración</button>
  <div class="menuFooter">Prototipo v0.1 · Godot/Godot alternative in HTML5</div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hudLeft">
    <div>
      <div class="hudTitle" id="hudTitle">Vasos Linfáticos</div>
      <div class="hudSubtitle" id="hudSubtitle">Nivel 1 de 5</div>
    </div>
    <div class="hudProgress"><div class="hudProgressFill" id="hudProgressFill" style="width:0%"></div></div>
    <div class="hudScore" id="hudScore">Puntos: 0</div>
  </div>
  <div class="hudRight">
    <button class="hudBtn" onclick="toggleMinimap()">🗺️ Mapa</button>
    <button class="hudBtn" onclick="togglePause()">⏸️ Pausa</button>
    <button class="hudBtn" onclick="goToMenu()">🏠 Menú</button>
  </div>
</div>

<!-- DIALOGUE -->
<div id="dialogueBox">
  <div class="dlgTitle" id="dlgTitle"></div>
  <div class="dlgText" id="dlgText"></div>
  <div class="dlgChoices" id="dlgChoices"></div>
</div>

<!-- INTERACTION PROMPT -->
<div id="interactPrompt">Presiona E para interactuar</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- QUIZ -->
<div id="quizScreen" class="overlay">
  <div class="quizHeader">
    <div class="quizTitle">📝 Evaluación</div>
    <div class="quizProgress"><div class="quizProgressFill" id="quizProgressFill" style="width:0%"></div></div>
    <div class="quizScore" id="quizScore">Puntuación: 0/0</div>
  </div>
  <div class="quizQuestion" id="quizQuestion"></div>
  <div class="quizAnswers" id="quizAnswers"></div>
  <div class="quizFeedback" id="quizFeedback"></div>
  <button class="quizNext" id="quizNext" onclick="nextQuestion()">Siguiente →</button>
  <div class="quizResult" id="quizResult" style="display:none"></div>
</div>

<!-- SANDBOX PANEL -->
<div id="sandboxPanel">
  <h3>🧪 Herramientas</h3>
  <button class="toolBtn" data-tool="flow" onclick="selectTool('flow')">💧 Control de flujo</button>
  <button class="toolBtn" data-tool="valve" onclick="selectTool('valve')">🔧 Añadir/Quitar válvula</button>
  <button class="toolBtn" data-tool="pump" onclick="selectTool('pump')">💪 Activar bomba</button>
  <button class="toolBtn" data-tool="obstruct" onclick="selectTool('obstruct')">🚫 Añadir obstrucción</button>
  <button class="toolBtn" data-tool="pathogen" onclick="selectTool('pathogen')">🦠 Añadir patógeno</button>
  <button class="toolBtn" data-tool="clear" onclick="clearSandbox()">🗑️ Limpiar todo</button>
  <div class="speedControl">
    <label>Velocidad:</label>
    <input type="range" min="0.25" max="3" step="0.25" value="1" oninput="setSpeed(this.value)">
    <span id="speedLabel">1x</span>
  </div>
</div>

<!-- MINIMAP -->
<div id="minimap"><canvas id="minimapCanvas"></canvas></div>

<!-- PAUSE -->
<div id="pauseScreen" class="overlay">
  <h2>⏸️ Pausa</h2>
  <button class="menuBtn" onclick="togglePause()">▶️ Continuar</button>
  <button class="menuBtn" onclick="goToMenu()">🏠 Menú principal</button>
</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="overlay">
  <div class="settingsContent">
    <h2>⚙️ Configuración</h2>
    <div class="settingRow">
      <label>Modo de color</label>
      <select id="colorblindSelect" onchange="setColorblind(this.value)">
        <option value="default">Normal</option>
        <option value="protanopia">Protanopía</option>
        <option value="deuteranopia">Deuteranopía</option>
        <option value="tritanopia">Tritanopía</option>
      </select>
    </div>
    <div class="settingRow">
      <label>Tamaño de texto</label>
      <input type="range" min="0.75" max="1.5" step="0.25" value="1" oninput="setTextSize(this.value)">
    </div>
    <div class="settingRow">
      <label>Subtítulos</label>
      <input type="checkbox" id="subtitlesCheck" checked onchange="settings.subtitles=this.checked">
    </div>
    <div class="settingRow">
      <label>Narración de audio</label>
      <input type="checkbox" id="narrationCheck" onchange="settings.narration=this.checked">
    </div>
    <button class="menuBtn tertiary" onclick="hideSettings()" style="margin-top:16px">Cerrar</button>
  </div>
</div>

<!-- BADGE POPUP -->
<div id="badgePopup">🏅 ¡Medalla obtenida!</div>

<!-- ZOOM INDICATOR -->
<div id="zoomIndicator">Zoom: x1</div>

<!-- KNOWLEDGE CARD POPUP -->
<div id="cardPopup">
  <div class="cardTitle" id="cardPopupTitle"></div>
  <div class="cardContent" id="cardPopupContent"></div>
  <button class="cardClose" onclick="closeCardPopup()">Cerrar</button>
</div>

<script>
// ============================================================
// LINFOVIA - Complete HTML5 Game Engine
// ============================================================

// --- CONSTANTS ---
const C = {
  GREEN:'#A3D9A5', AQUA:'#BEE7E8', LAVENDER:'#EADFF7', CREAM:'#FFF5E6',
  WHITE:'#F7F7F9', GRAY:'#EDEDED', CORAL:'#FFB3A7', FLOW:'#7FD6B8',
  RED:'#E64A4A', DARK:'#333', DARK2:'#555', PATH_COLOR:'#C8E8D8'
};

const W = () => window.innerWidth, H = () => window.innerHeight;

// --- CANVAS SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');

function resizeCanvas() {
  canvas.width = W(); canvas.height = H();
  mmCanvas.width = 200; mmCanvas.height = 100;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// --- AUDIO (Web Audio API synthesized) ---
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playTone(freq, duration, type='sine', vol=0.15) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function sfxClick() { playTone(800, 0.08, 'sine', 0.1); }
function sfxConfirm() { playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }
function sfxWrong() { playTone(200, 0.3, 'square', 0.08); }
function sfxBubble() { playTone(600 + Math.random()*400, 0.1, 'sine', 0.06); }
function sfxUnlock() { [523,659,784,1047].forEach((f,i) => setTimeout(()=>playTone(f,0.2,'sine',0.12), i*80)); }
function sfxValve() { playTone(300, 0.15, 'triangle', 0.1); }
function sfxPump() { playTone(150, 0.3, 'sawtooth', 0.06); }
function sfxBadge() { [784,988,1175,1319,1568].forEach((f,i) => setTimeout(()=>playTone(f,0.3,'sine',0.1), i*120)); }

// --- GAME STATE ---
const state = {
  mode: 'menu', // menu, learning, exploration, sandbox, quiz, paused
  level: 'vessels',
  score: 0,
  progress: 0,
  unlocked: ['vessels'],
  badges: [],
  cards: {},
  time: 0,
  currentPuzzle: 0,
  puzzlesCompleted: [],
  minigameActive: false
};

const settings = {
  colorblind: 'default',
  textSize: 1,
  subtitles: true,
  narration: false
};

// --- PLAYER ---
const player = {
  x: 100, y: 300, speed: 180, size: 16,
  vx: 0, vy: 0, zoom: 0,
  facing: { x: 1, y: 0 },
  nearInteractable: null
};

// --- LEVEL DATA ---
const levelBounds = { x: 0, y: 0, w: 1600, h: 800 };

// Vessel path (main flow route)
const vesselPath = [
  {x:50,y:350},{x:200,y:300},{x:350,y:250},{x:500,y:280},
  {x:650,y:250},{x:800,y:300},{x:950,y:280},{x:1100,y:350},
  {x:1200,y:400},{x:1350,y:380},{x:1500,y:350}
];

// Vessels (decorative wider paths)
const vesselWalls = [
  // Main vessel - top wall
  [{x:30,y:310},{x:200,y:260},{x:350,y:210},{x:500,y:240},{x:650,y:210},{x:800,y:260},{x:950,y:240},{x:1100,y:310},{x:1200,y:360},{x:1350,y:340},{x:1520,y:310}],
  // Main vessel - bottom wall
  [{x:30,y:390},{x:200,y:340},{x:350,y:290},{x:500,y:320},{x:650,y:290},{x:800,y:340},{x:950,y:320},{x:1100,y:390},{x:1200,y:440},{x:1350,y:420},{x:1520,y:390}]
];

// Interactables
let valves = [
  {id:'v1', x:350, y:250, open:false, size:20},
  {id:'v2', x:650, y:250, open:false, size:20},
  {id:'v3', x:950, y:280, open:false, size:20}
];
let pumps = [
  {id:'p1', x:450, y:360, active:false, cooldown:0, radius:60, strength:1.5},
  {id:'p2', x:750, y:360, active:false, cooldown:0, radius:60, strength:1.5},
  {id:'p3', x:1050, y:370, active:false, cooldown:0, radius:60, strength:1.5}
];
let obstructions = [
  {id:'o1', x:800, y:300, hits:2, maxHits:2, size:25}
];
let knowledgeCards = [
  {id:'card_vessel', x:250, y:200, title:'Estructura de los Vasos',
   content:'Los vasos linfáticos son conductos de pared fina con válvulas internas que impiden el reflujo. Transportan linfa desde los tejidos hacia el sistema venoso, recogiendo líquidos y células inmunes.', collected:false},
  {id:'card_valves', x:550, y:180, title:'Válvulas Linfáticas',
   content:'Las válvulas semilunares aseguran que la linfa fluya en una sola dirección. Se abren cuando la presión aguas abajo es menor y se cierran para evitar reflujo.', collected:false},
  {id:'card_pumps', x:900, y:200, title:'Bombas Musculares',
   content:'La contracción de los músculos esqueléticos comprime los vasos linfáticos, impulsando la linfa. Por eso el ejercicio favorece el drenaje linfático.', collected:false}
];

// --- PARTICLES ---
let particles = [];
let particlesEnabled = true;

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.t = 0; // position along path (0-1)
    this.speed = 0.02 + Math.random() * 0.015;
    this.offset = (Math.random() - 0.5) * 40;
    this.size = 3 + Math.random() * 4;
    this.alpha = 0.4 + Math.random() * 0.4;
    this.color = Math.random() > 0.5 ? C.GREEN : C.AQUA;
  }
  update(dt) {
    if (!particlesEnabled) return;
    let multiplier = 1;

    // Check valves
    valves.forEach(v => {
      if (!v.open) {
        let vp = getTAtX(v.x);
        if (Math.abs(this.t - vp) < 0.03) multiplier = 0.05;
      }
    });

    // Check pumps
    let px = getXAtT(this.t), py = getYAtT(this.t);
    pumps.forEach(p => {
      if (p.active) {
        let dist = Math.hypot(px - p.x, py - p.y);
        if (dist < p.radius) {
          multiplier += (1 - dist/p.radius) * p.strength;
        }
      }
    });

    // Check obstructions
    obstructions.forEach(o => {
      let dist = Math.hypot(px - o.x, py - o.y);
      if (dist < o.size + 15) multiplier *= 0.2;
    });

    this.t += this.speed * dt * multiplier;
    if (this.t > 1) this.reset();
  }
  draw(ctx) {
    let x = getXAtT(this.t), y = getYAtT(this.t) + this.offset;
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.globalAlpha = this.alpha * 0.3;
    ctx.beginPath();
    ctx.arc(x, y, this.size * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

for (let i = 0; i < 100; i++) {

  p.t = Math.random();
  particles.push(p);
}

// Get position along vessel path by parameter t
function getXAtT(t) {
  t = Math.max(0, Math.min(1, t));
  let totalLen = 0, segLens = [];
  for (let i = 1; i < vesselPath.length; i++) {
    let dx = vesselPath[i].x - vesselPath[i-1].x;
    let dy = vesselPath[i].y - vesselPath[i-1].y;
    let len = Math.hypot(dx, dy);
    segLens.push(len);
    totalLen += len;
  }
  let target = t * totalLen;
  let accum = 0;
  for (let i = 0; i < segLens.length; i++) {
    if (accum + segLens[i] >= target) {
      let frac = (target - accum) / segLens[i];
      return vesselPath[i].x + (vesselPath[i+1].x - vesselPath[i].x) * frac;
    }
    accum += segLens[i];
  }
  return vesselPath[vesselPath.length-1].x;
}

function getYAtT(t) {
  t = Math.max(0, Math.min(1, t));
  let totalLen = 0, segLens = [];
  for (let i = 1; i < vesselPath.length; i++) {
    let dx = vesselPath[i].x - vesselPath[i-1].x;
    let dy = vesselPath[i].y - vesselPath[i-1].y;
    let len = Math.hypot(dx, dy);
    segLens.push(len);
    totalLen += len;
  }
  let target = t * totalLen;
  let accum = 0;
  for (let i = 0; i < segLens.length; i++) {
    if (accum + segLens[i] >= target) {
      let frac = (target - accum) / segLens[i];
      return vesselPath[i].y + (vesselPath[i+1].y - vesselPath[i].y) * frac;
    }
    accum += segLens[i];
  }
  return vesselPath[vesselPath.length-1].y;
}

function getTAtX(x) {
  let bestT = 0, bestDist = Infinity;
  for (let t = 0; t <= 1; t += 0.005) {
    let d = Math.abs(getXAtT(t) - x);
    if (d < bestDist) { bestDist = d; bestT = t; }
  }
  return bestT;
}

// --- INPUT ---
const keys = {};
let mouseX = 0, mouseY = 0;
let mouseDown = false;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape' && (state.mode === 'learning' || state.mode === 'exploration' || state.mode === 'sandbox')) togglePause();
  if (e.key.toLowerCase() === 'e' && state.mode !== 'menu' && state.mode !== 'quiz' && state.mode !== 'paused') tryInteract();
  if (e.key.toLowerCase() === 'q') { player.zoom = Math.min(3, player.zoom + 1); updateZoomDisplay(); }
  if (e.key.toLowerCase() === 'x') { player.zoom = Math.max(0, player.zoom - 1); updateZoomDisplay(); }
  if (e.key.toLowerCase() === 'm') toggleMinimap();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  if (state.mode === 'sandbox') handleSandboxClick(e.clientX, e.clientY);
  else tryClickInteract(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });

function tryClickInteract(mx, my) {
  if (state.mode === 'menu' || state.mode === 'quiz') return;
  let wx = mx + camera.x, wy = my + camera.y;
  let interacted = false;
  valves.forEach(v => {
    if (Math.hypot(wx - v.x, wy - v.y) < v.size + 10) {
      v.open = !v.open; sfxValve(); interacted = true;
      checkPuzzle1();
    }
  });
  pumps.forEach(p => {
    if (Math.hypot(wx - p.x, wy - p.y) < 30 && p.cooldown <= 0) {
      p.active = true; p.cooldown = 2; sfxPump(); interacted = true;
      checkPuzzle2();
    }
  });
  obstructions.forEach((o, i) => {
    if (Math.hypot(wx - o.x, wy - o.y) < o.size + 10) {
      o.hits--; sfxBubble(); interacted = true;
      if (o.hits <= 0) { obstructions.splice(i, 1); checkPuzzle3(); }
    }
  });
  knowledgeCards.forEach(c => {
    if (!c.collected && Math.hypot(wx - c.x, wy - c.y) < 30) {
      c.collected = true; state.cards[c.id] = true;
      showCardPopup(c); sfxUnlock(); interacted = true;
    }
  });
}

function tryInteract() {
  // Keyboard E interaction - use nearest interactable to player
  let nearest = null, minDist = 80;
  [...valves, ...pumps.map(p=>({...p, isPump:true})), ...obstructions.map(o=>({...o, isObs:true})), ...knowledgeCards.filter(c=>!c.collected)].forEach(item => {
    let d = Math.hypot(player.x - item.x, player.y - item.y);
    if (d < minDist) { minDist = d; nearest = item; }
  });
  if (!nearest) return;
  sfxClick();

  if (nearest.isPump) {
    let p = pumps.find(pp => pp.id === nearest.id);
    if (p && p.cooldown <= 0) { p.active = true; p.cooldown = 2; sfxPump(); checkPuzzle2(); }
  } else if (nearest.isObs) {
    let o = obstructions.find(oo => oo.id === nearest.id);
    if (o) { o.hits--; sfxBubble(); if (o.hits <= 0) { obstructions.splice(obstructions.indexOf(o),1); checkPuzzle3(); } }
  } else if (nearest.title) { // Knowledge card
    let c = knowledgeCards.find(cc => cc.id === nearest.id);
    if (c && !c.collected) { c.collected = true; state.cards[c.id] = true; showCardPopup(c); sfxUnlock(); }
  } else { // Valve
    let v = valves.find(vv => vv.id === nearest.id);
    if (v) { v.open = !v.open; sfxValve(); checkPuzzle1(); }
  }
}

// --- CAMERA ---
const camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

function updateCamera() {
  let zoomLevels = [1, 1.3, 1.8, 2.5];
  let zoom = zoomLevels[player.zoom];
  camera.targetX = player.x - W() / (2 * zoom);
  camera.targetY = player.y - H() / (2 * zoom);
  camera.x += (camera.targetX - camera.x) * 0.1;
  camera.y += (camera.targetY - camera.y) *0.1;
}

function updateZoomDisplay() {
  let labels = ['Normal','x1.3','x1.8','x2.5'];
  let el = document.getElementById('zoomIndicator');
  el.textContent = 'Zoom: ' + labels[player.zoom];
  el.classList.add('active');
}

// --- PLAYER UPDATE ---
function updatePlayer(dt) {
  if (state.mode !== 'learning' && state.mode !== 'exploration' && state.mode !== 'sandbox') return;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 || dy !== 0) {
    let len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.facing = { x: dx, y: dy };
  }
  player.vx += dx * player.speed * dt * 5;
  player.vy += dy * player.speed * dt * 5;
  player.vx *= 0.85;
  player.vy *= 0.85;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Bounds
  player.x = Math.max(30, Math.min(levelBounds.w - 30, player.x));
  player.y = Math.max(30, Math.min(levelBounds.h - 30, player.y));

  // Check proximity to interactables
  let near = null;
  valves.forEach(v => { if (Math.hypot(player.x-v.x, player.y-v.y) < 50) near = v; });
  if (!near) pumps.forEach(p => { if (Math.hypot(player.x-p.x, player.y-p.y) < 50 && p.cooldown <= 0) near = p; });
  if (!near) obstructions.forEach(o => { if (Math.hypot(player.x-o.x, player.y-o.y) < 50) near = o; });
  if (!near) knowledgeCards.forEach(c => { if (!c.collected && Math.hypot(player.x-c.x, player.y-c.y) < 50) near = c; });
  player.nearInteractable = near;

  let prompt = document.getElementById('interactPrompt');
  if (near) {
    prompt.classList.add('active');
    if (near.title) prompt.textContent = 'Presiona E para leer';
    else if (near.open !== undefined) prompt.textContent = near.open ? 'Válvula abierta (E para cerrar)' : 'Válvula cerrada (E para abrir)';
    else if (near.active !== undefined) prompt.textContent = near.cooldown > 0 ? 'Enfriamiento...' : 'Bomba muscular (E para activar)';
    else if (near.hits !== undefined) prompt.textContent = `Obstrucción (${near.hits} golpes)`;
    else prompt.textContent = 'Presiona E para interactuar';
  } else {
    prompt.classList.remove('active');
  }
}

// --- DRAWING ---
function drawBackground(ctx) {
  // Gradient background
  let grad = ctx.createLinearGradient(0, 0, 0, H());
  grad.addColorStop(0, '#F0F5F0');
  grad.addColorStop(0.5, '#F7F7F9');
  grad.addColorStop(1, '#E8F0E8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W(), H());

  // Grid pattern
  ctx.strokeStyle = 'rgba(200,220,200,0.15)';
  ctx.lineWidth = 1;
  let gridSize = 60;
  let ox = -(camera.x % gridSize), oy = -(camera.y % gridSize);
  for (let x = ox; x < W(); x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H()); ctx.stroke();
  }
  for (let y = oy; y < H(); y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W(), y); ctx.stroke();
  }
}

function drawVesselWalls(ctx) {
  ctx.strokeStyle = C.PATH_COLOR;
  ctx.lineWidth = 40;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  vesselWalls.forEach(wall => {
    ctx.beginPath();
    wall.forEach((p, i) => {
      let sx = p.x - camera.x, sy = p.y - camera.y;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    });
    ctx.stroke();
  });

  // Inner highlight
  ctx.strokeStyle = 'rgba(200,232,216,0.3)';
  ctx.lineWidth = 36;
  vesselWalls.forEach(wall => {
    ctx.beginPath();
    wall.forEach((p, i) => {
      let sx = p.x - camera.x, sy = p.y - camera.y;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    });
    ctx.stroke();
  });
}

function drawValve(ctx, v) {
  let sx = v.x - camera.x, sy = v.y - camera.y;
  // Check if on screen
  if (sx < -50 || sx > W()+50 || sy < -50 || sy > H()+50) return;

  ctx.save();
  ctx.translate(sx, sy);

  // Valve body
  ctx.fillStyle = v.open ? C.FLOW : C.RED;
  ctx.globalAlpha = 0.8;

  // Semilunar flaps
  ctx.beginPath();
  ctx.ellipse(-v.size * 0.3, 0, v.size * 0.4, v.size * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(v.size * 0.3, 0, v.size * 0.4, v.size * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // Label
  ctx.fillStyle = C.DARK;
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(v.open ? 'ABIERTA' : 'CERRADA', 0, -v.size - 5);
  ctx.fillText(v.id, 0, v.size + 15);

  ctx.restore();
}

function drawPump(ctx, p) {
  let sx = p.x - camera.x, sy = p.y - camera.y;
  if (sx < -50 || sx > W()+50 || sy < -50 || sy > H()+50) return;

  ctx.save();
  ctx.translate(sx, sy);

  // Circle
  let isActive = p.active;
  ctx.fillStyle = isActive ? C.FLOW : C.AQUA;
  ctx.globalAlpha = isActive ? 0.9 : 0.5;
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fill();

  // Muscle symbol
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.DARK;
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💪', 0, 0);

  // Cooldown
  if (p.cooldown > 0) {
    ctx.fillStyle = C.DARK2;
    ctx.font = '10px sans-serif';
    ctx.fillText(p.cooldown.toFixed(1) + 's', 0, 28);
  } else if (!isActive) {
    ctx.fillStyle = C.DARK2;
    ctx.font = '10px sans-serif';
    ctx.fillText(p.id, 0, 28);
  }

  ctx.restore();
}

function drawObstruction(ctx, o) {
  let sx = o.x - camera.x, sy = o.y - camera.y;
  if (sx < -50 || sx > W()+50 || sy < -50 || sy > H()+50) return;

  ctx.save();
  ctx.translate(sx, sy);

  // Coral mass
  ctx.fillStyle = C.CORAL;
  ctx.globalAlpha = 0.7 + (o.hits / o.maxHits) * 0.3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    let angle = (i / 8) * Math.PI * 2;
    let r = o.size * (0.7 + Math.sin(i * 2.5) * 0.3);
    let px = Math.cos(angle) * r, py = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.fillStyle = C.DARK;
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`🚫 ${o.hits}/${o.maxHits}`, 0, o.size + 15);

  ctx.restore();
}

function drawKnowledgeCard(ctx, c) {
  if (c.collected) return;
  let sx = c.x - camera.x, sy = c.y - camera.y;
  if (sx < -50 || sx > W()+50 || sy < -50 || sy > H()+50) return;

  ctx.save();
  ctx.translate(sx, sy);

  // Pulsing glow
  let pulse = Math.sin(state.time * 3) * 0.15 + 0.6;
  ctx.fillStyle = C.LAVENDER;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.fill();

  // Card icon
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = C.LAVENDER;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-12, -14, 24, 28, 4);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = C.GREEN;
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('📖', 0, 4);

  ctx.restore();
}

function drawPlayer(ctx) {
  let zoomLevels = [1, 1.3, 1.8, 2.5];
  let zoom = zoomLevels[player.zoom];
  let sx = (player.x - camera.x) * zoom;
  let sy = (player.y - camera.y) * zoom;

  // Actually apply zoom to the whole canvas later, here just draw at position
  let px = player.x - camera.x, py = player.y - camera.y;
  let size = player.size;

  ctx.save();
  ctx.translate(px, py);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath();
  ctx.ellipse(0, size + 2, size * 0.8, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body - lymphocyte inspired
  ctx.fillStyle = C.GREEN;
  ctx.beginPath();
  ctx.arc(0, 0, size, 0, Math.PI * 2);
  ctx.fill();

  // Inner glow
  ctx.fillStyle = C.FLOW;
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.arc(-3, -3, size * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Eyes
  let eyeOffX = player.facing.x * 3, eyeOffY = player.facing.y * 3;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-4 + eyeOffX, -4 + eyeOffY, 5, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(4 + eyeOffX, -4 + eyeOffY, 5, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = C.DARK;
  ctx.beginPath();
  ctx.arc(-3 + eyeOffX * 1.2, -4 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5 + eyeOffX * 1.2, -4 + eyeOffY * 1.2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = C.DARK;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 2, 5, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  // Backpack
  ctx.fillStyle = C.LAVENDER;
  ctx.beginPath();
  ctx.roundRect(size - 2, -6, 8, 12, 3);
  ctx.fill();

  ctx.restore();
}

function drawParticles(ctx) {
  particles.forEach(p => p.draw(ctx));
}

// --- MINIMAP ---
function drawMinimap() {
  if (!document.getElementById('minimap').classList.contains('active')) return;
  let w = 200, h = 100;
  mmCtx.fillStyle = 'rgba(247,247,249,0.95)';
  mmCtx.fillRect(0, 0, w, h);

  let sx = w / levelBounds.w, sy = h / levelBounds.h;

  // Vessel path
  mmCtx.strokeStyle = C.PATH_COLOR;
  mmCtx.lineWidth = 6;
  mmCtx.beginPath();
  vesselPath.forEach((p, i) => {
    if (i === 0) mmCtx.moveTo(p.x * sx, p.y * sy);
    else mmCtx.lineTo(p.x * sx, p.y * sy);
  });
  mmCtx.stroke();

  // Valves
  valves.forEach(v => {
    mmCtx.fillStyle = v.open ? C.FLOW : C.RED;
    mmCtx.fillRect(v.x * sx - 2, v.y * sy - 2, 4, 4);
  });

  // Knowledge cards
  knowledgeCards.forEach(c => {
    if (!c.collected) {
      mmCtx.fillStyle = C.LAVENDER;
      mmCtx.fillRect(c.x * sx - 2, c.y * sy - 2, 4, 4);
    }
  });

  // Player
  mmCtx.fillStyle = C.CORAL;
  mmCtx.beginPath();
  mmCtx.arc(player.x * sx, player.y * sy, 3, 0, Math.PI * 2);
  mmCtx.fill();
}

// --- GAME LOGIC ---
function checkPuzzle1() {
  // Puzzle 1: All valves must be open
  if (state.currentPuzzle === 0 && valves.every(v => v.open)) {
    completePuzzle('puzzle_valves', 100);
  }
}

function checkPuzzle2() {
  if (state.currentPuzzle === 1) {
    completePuzzle('puzzle_pumps', 100);
  }
}

function checkPuzzle3() {
  if (state.currentPuzzle === 2 && obstructions.length === 0) {
    completePuzzle('puzzle_obstruction', 100);
  }
}

function completePuzzle(id, points) {
  if (state.puzzlesCompleted.includes(id)) return;
  state.puzzlesCompleted.push(id);
  state.score += points;
  state.progress += 33;
  sfxConfirm();
  updateHUD();

  showDialogue(
    '✅ ¡Puzzle completado!',
    `Has completado: ${id.replace('puzzle_','').replace('_',' ').replace(/\b\w/g, c => c.toUpperCase())}\nPuntos: +${points}`,
    [{ label: 'Continuar', action: 'nextPuzzle' }]
  );

  setTimeout(() => startNextPuzzle(), 200);
}

function startNextPuzzle() {
  hideDialogue();
  if (state.puzzlesCompleted.length >= 3) {
    // All puzzles done - start quiz
    setTimeout(() => startQuiz(), 500);
  } else {
    state.currentPuzzle = state.puzzlesCompleted.length;
    showPuzzleIntro(state.currentPuzzle);
  }
}

function showPuzzleIntro(idx) {
  let intros = [
    { title: 'Puzzle 1: Válvulas Linfáticas', text: 'Las válvulas impiden el reflujo de la linfa. Haz clic en cada válvula para abrirla. Deben abrirse todas para que la linfa fluya correctamente.' },
    { title: 'Puzzle 2: Bombas Musculares', text: 'Las contracciones musculares impulsan la linfa. Haz clic en las bombas (💪) para activarlas y observa cómo las partículas aceleran.' },
    { title: 'Puzzle 3: Obstrucción', text: '¡Hay una obstrucción en el vaso! Haz clic sobre ella repetidamente para eliminarla y restaurar el flujo linfático.' }
  ];
  showDialogue(intros[idx].title, intros[idx].text, [{ label: '¡Entendido!', action: '' }]);
}

// --- DIALOGUE SYSTEM ---
function showDialogue(title, text, choices) {
  let dlg = document.getElementById('dialogueBox');
  document.getElementById('dlgTitle').textContent = title;
  document.getElementById('dlgText').textContent = text;
  let choicesDiv = document.getElementById('dlgChoices');
  choicesDiv.innerHTML = '';
  choices.forEach(c => {
    let btn = document.createElement('button');
    btn.className = 'dlgChoice';
    btn.textContent = c.label;
    btn.onclick = () => {
      sfxClick();
      if (c.action === 'nextPuzzle') startNextPuzzle();
      else hideDialogue();
    };
    choicesDiv.appendChild(btn);
  });
  dlg.classList.add('active');
}

function hideDialogue() {
  document.getElementById('dialogueBox').classList.remove('active');
}

function showCardPopup(card) {
  document.getElementById('cardPopupTitle').textContent = '📖 ' + card.title;
  document.getElementById('cardPopupContent').textContent = card.content;
  document.getElementById('cardPopup').classList.add('active');
  state.score += 25;
  updateHUD();
}

function closeCardPopup() {
  sfxClick();
  document.getElementById('cardPopup').classList.remove('active');
}

// --- BADGE SYSTEM ---
function earnBadge(name) {
  if (state.badges.includes(name)) return;
  state.badges.push(name);
  sfxBadge();
  let popup = document.getElementById('badgePopup');
  popup.textContent = '🏅 ¡Medalla: ' + name + '!';
  popup.classList.add('active');
  setTimeout(() => popup.classList.remove('active'), 3000);
}

// --- HUD ---
function updateHUD() {
  document.getElementById('hudScore').textContent = 'Puntos: ' + state.score;
  document.getElementById('hudProgressFill').style.width = state.progress + '%';
}

// --- GAME FLOW ---
function startGame(mode) {
  ensureAudio();
  sfxClick();
  state.mode = mode === 'learning' ? 'learning' : 'exploration';
  state.score = 0;
  state.progress = 0;
  state.currentPuzzle = 0;
  state.puzzlesCompleted = [];
  player.x = 100; player.y = 300;
  player.zoom = 0;

  // Reset interactables
  valves.forEach(v => v.open = false);
  pumps.forEach(p => { p.active = false; p.cooldown = 0; });
  obstructions = [{id:'o1', x:800, y:300, hits:2, maxHits:2, size:25}];
  knowledgeCards.forEach(c => c.collected = false);

  document.getElementById('mainMenu').classList.remove('active');
  document.getElementById('hud').classList.add('active');
  document.getElementById('hudTitle').textContent = 'Vasos Linfáticos';
  document.getElementById('hudSubtitle').textContent = mode === 'learning' ? 'Nivel 1 de 5 (Guiado)' : 'Exploración Libre';
  updateHUD();

  if (mode === 'learning') {
    showDialogue(
      '¡Bienvenido/a, Linfoexplorador/a!',
      'Hoy exploraremos los vasos linfáticos: finos conductos que transportan la linfa por todo el cuerpo, recogiendo líquidos y partículas de los tejidos.\n\nUsa WASD para moverte, E para interactuar, y clic en los elementos.',
      [{ label: 'Comenzar', action: '' }]
    );
    setTimeout(() => {
      if (document.getElementById('dialogueBox').classList.contains('active')) hideDialogue();
      startNextPuzzle();
    }, 5000);
  }
}

function startSandbox() {
  ensureAudio();
  sfxClick();
  state.mode = 'sandbox';
  state.score = 0;
  player.x = 400; player.y = 300;
  player.zoom = 0;

  valves.forEach(v => v.open = true);
  pumps.forEach(p => { p.active = false; p.cooldown = 0; });

  document.getElementById('hud').classList.add('active');
  document.getElementById('hudTitle').textContent = 'Laboratorio Virtual';
  document.getElementById('hudSubtitle').textContent = 'Sandbox - Experimenta libremente';
  document.getElementById('sandboxPanel').classList.add('active');
  updateHUD();

  showDialogue(
    '🧪 Laboratorio Virtual',
    'Experimenta libremente con el sistema linfático. Usa las herramientas del panel derecho para añadir válvulas, bombas, obstrucciones y patógenos. ¡Observa las consecuencias!',

  );
}

function goToMenu() {
  sfxClick();
  state.mode = 'menu';
  document.getElementById('hud').classList.remove('active');
  document.getElementById('sandboxPanel').classList.remove('active');
  document.getElementById('minimap').classList.remove('active');
  document.getElementById('zoomIndicator').classList.remove('active');
  document.getElementById('pauseScreen').classList.remove('active');
  document.getElementById('mainMenu').classList.add('active');

}

function togglePause() {
  sfxClick();
  if (state.mode === 'paused') {
    state.mode = state.prevMode || 'learning';
    document.getElementById('pauseScreen').classList.remove('active');
  } else if (state.mode === 'learning' || state.mode === 'exploration' || state.mode === 'sandbox') {
    state.prevMode = state.mode;
    state.mode = 'paused';
    document.getElementById('pauseScreen').classList.add('active');
  }
}

function toggleMinimap() {
  sfxClick();
  document.getElementById('minimap').classList.toggle('active');
}

// --- SANDBOX ---
let sandboxTool = 'flow';

function selectTool(tool) {
  sandboxTool = tool;
  document.querySelectorAll('.toolBtn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  sfxClick();
}

function clearSandbox() {
  sfxClick();
  valves = [];
  pumps = [];
  obstructions = [];
}

function setSpeed(val) {
  document.getElementById('speedLabel').textContent = val + 'x';
  // Adjust particle speeds
  particles.forEach(p => p.speed = (0.02 + Math.random() * 0.015) * parseFloat(val));
}

function handleSandboxClick(mx, my) {
  let wx = mx + camera.x, wy = my + camera.y;
  switch (sandboxTool) {
    case 'valve':
      let vid = 'v' + (valves.length + 1);
      valves.push({id:vid, x:wx, y:wy, open:true, size:20});
      sfxValve();
      break;
    case 'pump':
      let pid = 'p' + (pumps.length + 1);
      pumps.push({id:pid, x:wx, y:wy, active:false, cooldown:0, radius:60, strength:1.5});
      sfxPump();
      break;
    case 'obstruct':
      let oid = 'o' + (obstructions.length + 1);
      obstructions.push({id:oid, x:wx, y:wy, hits:3, maxHits:3, size:25});
      sfxBubble();
      break;
    case 'pathogen':
      sfxBubble();
      // Visual only - spawn coral particles
      for (let i = 0; i < 5; i++) {
        let p = new Particle();
        p.t = Math.random();
        p.color = C.CORAL;
        p.size = 5 + Math.random() * 3;
        p.offset = (Math.random() - 0.5) * 60;
        particles.push(p);
      }
      break;
  }
}

let quizState = { current: 0, score: 0, answered: false };

function startQuiz() {
  state.mode = 'quiz';
  document.getElementById('hud').classList.remove('active');
  document.getElementById('dialogueBox').classList.remove('active');

  quizState = { current: 0, score: 0, answered: false };
  document.getElementById('quizScreen').classList.add('active');
  document.getElementById('quizResult').style.display = 'none';
  document.getElementById('quizNext').style.display = 'none';

  showQuizQuestion();
}

function showQuizQuestion() {
  if (quizState.current >= quizQuestions.length) {
    showQuizResult();
    return;
  }

  let q = quizQuestions[quizState.current];
  quizState.answered = false;

  document.getElementById('quizQuestion').textContent = q.q;
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizNext').style.display = 'none';
  document.getElementById('quizProgressFill').style.width = (quizState.current / quizQuestions.length * 100) + '%';
  document.getElementById('quizScore').textContent = `Puntuación: ${quizState.score}/${quizQuestions.length}`;

  let answersDiv = document.getElementById('quizAnswers');
  answersDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    let btn = document.createElement('button');
    btn.className = 'quizAnswer';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i, btn);
    answersDiv.appendChild(btn);
  });
}

function selectAnswer(index, btn) {
  if (quizState.answered) return;
  quizState.answered = true;

  let q = quizQuestions[quizState.current];
  let isCorrect = index === q.correct;

  // Disable all buttons
  document.querySelectorAll('.quizAnswer').forEach(b => b.classList.add('disabled'));

  if (isCorrect) {
    btn.classList.add('correct');
    quizState.score++;
    document.getElementById('quizFeedback').innerHTML = '✅ <b>¡Correcto!</b> ' + q.explanation;
    sfxConfirm();
  } else {
    btn.classList.add('incorrect');
    // Highlight correct answer
    document.querySelectorAll('.quizAnswer')[q.correct].classList.add('correct');
    document.getElementById('quizFeedback').innerHTML = '❌ <b>Incorrecto.</b> ' + q.explanation;
    sfxWrong();
  }

  document.getElementById('quizScore').textContent = `Puntuación: ${quizState.score}/${quizQuestions.length}`;
  document.getElementById('quizNext').style.display = 'inline-block';
}

function nextQuestion() {
  sfxClick();
  quizState.current++;
  showQuizQuestion();
}

function showQuizResult() {
  let pct = (quizState.score / quizQuestions.length * 100).toFixed(0);
  let msg = '';
  if (pct >= 90) { msg = '¡Excelente! Dominas los conceptos del sistema linfático.'; earnBadge('Quiz Expert'); }
  else if (pct >= 70) { msg = '¡Muy bien! Buen conocimiento, repasa los puntos que fallaste.'; }
  else if (pct >= 50) { msg = 'Aprobado. Te recomendamos repasar el nivel antes de continuar.'; }
  else { msg = 'Necesitas repasar. Vuelve al nivel y explora de nuevo.'; }

  document.getElementById('quizQuestion').textContent = '';
  document.getElementById('quizAnswers').innerHTML = '';
  document.getElementById('quizFeedback').innerHTML = '';
  document.getElementById('quizNext').style.display = 'none';
  document.getElementById('quizProgressFill').style.width = '100%';

  let resultDiv = document.getElementById('quizResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = `
    <h3>Resultado: ${quizState.score}/${quizQuestions.length} (${pct}%)</h3>
    <p>${msg}</p>
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="menuBtn primary" onclick="goToMenu()" style="min-width:160px;padding:10px 20px;font-size:15px">🏠 Menú principal</button>
    </div>
  `;

  state.progress = 100;
  state.score += quizState.score * 50;
  earnBadge('Primer Paso');
}

// --- MAIN LOOP ---
let lastTime = 0;

function gameLoop(timestamp) {
  let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  state.time += dt;

  // Clear
  ctx.clearRect(0, 0, W(), H());

  if (state.mode === 'menu') {
    // Just draw animated background
    drawMenuBackground(dt);
  } else if (state.mode === 'paused') {
    drawGameScene(dt);
  } else {
    if (state.mode !== 'quiz') {
      updatePlayer(dt);
      updateCamera();

      // Update particles
      particles.forEach(p => p.update(dt));

      // Update pump cooldowns
      pumps.forEach(p => { if (p.cooldown > 0) p.cooldown -= dt; if (p.cooldown <= 0) p.active = false; });

      drawGameScene(dt);
      drawMinimap();
    }
  }

  requestAnimationFrame(gameLoop);
}

function drawMenuBackground(dt) {
  let grad = ctx.createRadialGradient(W()/2, H()/2, 0, W()/2, H()/2, W() * 0.6);
  grad.addColorStop(0, '#F7F7F9');
  grad.addColorStop(0.5, '#E8F0E8');
  grad.addColorStop(1, '#D0E8D0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W(), H());

  // Floating particles
  for (let i = 0; i < 30; i++) {
    let x = (Math.sin(state.time * 0.3 + i * 1.7) * 0.5 + 0.5) * W();
    let y = (Math.cos(state.time * 0.2 + i * 2.3) * 0.5 + 0.5) * H();
    let size = 2 + Math.sin(i) * 2;
    ctx.fillStyle = i % 3 === 0 ? C.GREEN : i % 3 === 1 ? C.AQUA : C.FLOW;
    ctx.globalAlpha = 0.15 + Math.sin(state.time + i) * 0.1;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGameScene(dt) {
  ctx.save();

  // Apply zoom
  if (state.mode !== 'quiz') {
    let zoomLevels = [1, 1.3, 1.8, 2.5];
    let zoom = zoomLevels[player.zoom];
    ctx.translate(W()/2, H()/2);
    ctx.scale(zoom, zoom);
    ctx.translate(-W()/2, -H()/2);
  }

  drawBackground(ctx);
  drawVesselWalls(ctx);
  drawParticles(ctx);

  // Draw interactables
  valves.forEach(v => drawValve(ctx, v));
  pumps.forEach(p => drawPump(ctx, p));
  obstructions.forEach(o => drawObstruction(ctx, o));
  knowledgeCards.forEach(c => drawKnowledgeCard(ctx, c));

  // Draw player
  if (state.mode !== 'quiz') drawPlayer(ctx);

  ctx.restore();
}

// --- POLYFILL roundRect ---
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r,r,r,r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}

// --- START ---
requestAnimationFrame(gameLoop);
